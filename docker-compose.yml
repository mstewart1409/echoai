# ---------------------------------------------------------------------------
# echoai — Docker Compose with Watchtower auto-update
# ---------------------------------------------------------------------------
# Watchtower polls GHCR for new images and automatically restarts the
# echoai container when a new version is pushed.
# A single Watchtower instance on the host watches all labeled containers.
# If Watchtower is not yet running, deploy it separately or uncomment the
# watchtower service block below.
# ---------------------------------------------------------------------------

services:
  echoai:
    image: ghcr.io/mstewart1409/echoai:latest
    container_name: echoai
    restart: unless-stopped
    # .env contains secrets — ensure chmod 600 .env on the host
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "5000:5000"
    volumes:
      - ./downloads:/app/downloads
      - ./transcripts:/app/transcripts
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Uncomment if no Watchtower instance is running on this host:
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

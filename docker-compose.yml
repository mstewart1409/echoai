# ---------------------------------------------------------------------------
# echoai — Docker Compose with Watchtower auto-update
# ---------------------------------------------------------------------------
# Watchtower polls GHCR for new images and automatically restarts the
# echoai container when a new version is pushed.
# A single Watchtower instance on the host watches all labeled containers.
# If Watchtower is not yet running, deploy it separately or uncomment the
# watchtower service block below.
# ---------------------------------------------------------------------------

services:
  echoai:
    image: ghcr.io/mstewart1409/echoai:latest
    container_name: echoai
    restart: unless-stopped
    # .env contains secrets — ensure chmod 600 .env on the host
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./downloads:/app/downloads:ro
      - ./transcripts:/app/transcripts:ro
    read_only: true
    tmpfs:
      # Sized explicitly: tmpfs is RAM, and it counts against mem_limit below.
      # An unbounded /tmp lets a runaway writer (the app log, a temp file) eat
      # the whole 512 MB budget and OOM the container. 64 MB comfortably holds
      # the ~8 MB rotating log set with room to spare.
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    memswap_limit: 512m
    # Docker's json-file driver is UNBOUNDED by default — on a Pi that quietly
    # fills the SD card. The app already writes its own rotating log to /tmp
    # for the /logs page; this caps what Docker keeps for `docker compose logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Uncomment if no Watchtower instance is running on this host:
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - /home/pi/.docker/config.json:/config.json:ro
  #   environment:
  #     DOCKER_API_VERSION: "1.54"
  #     WATCHTOWER_POLL_INTERVAL: 300
  #     WATCHTOWER_LABEL_ENABLE: "true"
  #     WATCHTOWER_CLEANUP: "true"
  #     WATCHTOWER_LOG_LEVEL: info
  #     DOCKER_CONFIG: /
  #     WATCHTOWER_HTTP_API_METRICS: "false"
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

# ---------------------------------------------------------------------------
# Reusable build workflow
# ---------------------------------------------------------------------------
# Builds the Docker image and pushes to GitHub Container Registry (ghcr.io).
# Called by deploy.yml.
# Lint & tests run separately on PRs via lint-test.yml.
# ---------------------------------------------------------------------------

name: Build

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev | prod)"
        required: true
        type: string
      image_tag:
        description: "Docker image tag"
        required: true
        type: string
      ref:
        description: "Git ref to checkout (leave empty for default)"
        required: false
        type: string
        default: ''
      version:
        description: "Semver version to tag the image with (optional, e.g. 0.3.0)"
        required: false
        type: string
        default: ''
    outputs:
      image_uri:
        description: "Full GHCR image URI"
        value: ${{ jobs.build.outputs.image_uri }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and push Docker image
        id: meta
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE_NAME_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="${REGISTRY}/${IMAGE_NAME_LOWER}:${IMAGE_TAG}"
          BUILD_TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          TAGS="--tag ${IMAGE_URI} --tag ${REGISTRY}/${IMAGE_NAME_LOWER}:latest"
          if [ -n "${VERSION}" ]; then
            TAGS="${TAGS} --tag ${REGISTRY}/${IMAGE_NAME_LOWER}:${VERSION}"
          fi

          docker buildx build \
            --platform linux/arm64 \
            --build-arg BUILD_ID=${{ github.sha }} \
            --build-arg BUILD_TIMESTAMP="${BUILD_TS}" \
            --build-arg GIT_BRANCH=${{ github.ref_name }} \
            ${TAGS} \
            --push \
            .

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
